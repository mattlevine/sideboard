# Contributors sign CLA.md by commenting on the pull request.
# Signatures are committed to signatures/version1/cla.json on main.
# Do not add that file by hand — an existing file makes the first run fail.
#
# pull_request_target runs this file from the default branch, with the
# repository token. This workflow must not check out the pull request head.
#
# Pinned to contributor-assistant/github-action v2.6.1
# (ca4a40a7d1004f18d9960b404b97e5f30a505a08). That repository is archived.
# A material CLA change should use a new path-to-signatures (version2)
# so previous signatures do not cover the new text.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        # The comment body must match CLA.md and custom-pr-sign-comment (the action default).
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/mattlevine/sideboard/blob/main/CLA.md
          branch: main
          # GitHub Apps that open pull requests (dependabot[bot], renovate[bot], …).
          allowlist: '*[bot]'
          # The signature record is the JSON file. Leave merged pull requests open for discussion.
          lock-pullrequest-aftermerge: false
