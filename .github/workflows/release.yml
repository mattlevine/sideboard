name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.3
      # Do not set registry-url: setup-node would write an empty
      # _authToken= line that makes npm skip the OIDC exchange.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sideboard-ai/core build
      - run: pnpm --filter @sideboard-ai/cli build
      - run: pnpm --filter @sideboard-ai/cli test
      # No `if: secrets.*` — GitHub rejects the secrets context in `if`.
      # No NODE_AUTH_TOKEN — a token (and 2FA) would override OIDC.
      - name: Publish CLI + MCP (core) to npm
        run: node scripts/publish-npm.js

  release-desktop-mac:
    runs-on: macos-latest
    env:
      # electron-vite OOM'd at the default ~2 GiB heap on macos-latest (v0.1.142).
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sideboard-ai/core build
      - run: pnpm --filter @sideboard-ai/cli build
      # electron-builder's CSC_LINK path creates a temp keychain, then calls
      # `security set-key-partition-list -k` with the .p12 password instead of
      # the keychain password (electron-userland/electron-builder#10066). macOS
      # 26.5 let that through; 26.6 (macos-latest image 20260831) rejects it
      # with SecKeychainUnlock. Import the cert ourselves and leave CSC_LINK
      # unset so electron-builder auto-discovers the identity.
      - name: Import Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "MAC_CSC_LINK empty — unsigned pack"
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/sideboard-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          if [ -f "$CSC_LINK" ]; then
            cp "$CSC_LINK" "$CERT_PATH"
          elif [[ "$CSC_LINK" == file://* ]]; then
            cp "${CSC_LINK#file://}" "$CERT_PATH"
          else
            echo -n "$CSC_LINK" | base64 --decode -o "$CERT_PATH"
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          rm -f "$CERT_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Developer ID Application'; then
            echo "Imported keychain has no Developer ID Application identity" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "SIDEBOARD_MAC_SIGNED=1" >> "$GITHUB_ENV"
      - name: Build & publish Electron (signed)
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Do not set CSC_LINK / CSC_KEY_PASSWORD here — that re-enters the
          # broken temp-keychain path on macos-26.6+.
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm exec electron-vite build
          node scripts/stage-bundled-node.js
          node scripts/stage-sideboard-mcp.js
          node scripts/stage-cursor-runtime.js
          # electron-builder + electron-updater publish to GitHub Releases
          # Signing/notarization require the imported identity + APPLE_* secrets;
          # unsigned builds still upload artifacts but cannot auto-update on macOS.
          # uploads.github.com often 500s "Error saving asset" on the ~250MB zip
          # after the dmg landed (v0.1.204). Keep the local zip and retry via gh.
          set +e
          if [ -n "$SIDEBOARD_MAC_SIGNED" ]; then
            pnpm exec electron-builder --mac --publish always -c.forceCodeSigning=true
          else
            pnpm exec electron-builder --mac --publish always -c.mac.identity=null
          fi
          eb=$?
          set -e

          TAG="${GITHUB_REF_NAME}"
          ZIP=""
          DMG=""
          for f in release/Sideboard-*-arm64-mac.zip; do
            [ -f "$f" ] || continue
            ZIP="$f"
            break
          done
          for f in release/Sideboard-*-arm64.dmg; do
            [ -f "$f" ] || continue
            DMG="$f"
            break
          done
          if [ -z "$ZIP" ]; then
            echo "electron-builder exited ${eb:-1} and produced no zip"
            exit "${eb:-1}"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "${TAG#v}" --verify-tag --notes "Sideboard ${TAG}"
          fi
          upload_missing() {
            local file="$1"
            local name i
            name=$(basename "$file")
            [ -f "$file" ] || return 0
            for i in 1 2 3 4 5 6; do
              if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
                echo "$name already on GitHub Release"
                return 0
              fi
              echo "gh release upload $name (attempt $i)"
              if gh release upload "$TAG" "$file" --clobber; then
                return 0
              fi
              sleep $((i * 20))
            done
            echo "failed to upload $name" >&2
            return 1
          }
          # electron-builder often times out on the dmg after the blockmap lands
          # (v0.1.206). Retry dmg + zip + latest-mac.yml via gh.
          upload_missing "$DMG"
          upload_missing "${DMG}.blockmap"
          upload_missing "$ZIP"
          upload_missing "${ZIP}.blockmap"
          upload_missing release/latest-mac.yml
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$(basename "$ZIP")"
          if [ -n "$DMG" ]; then
            gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$(basename "$DMG")"
          fi
