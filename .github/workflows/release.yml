name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sideboard-ai/core build
      - run: pnpm --filter @sideboard-ai/cli build
      - run: pnpm --filter @sideboard-ai/cli test
      - name: Publish CLI + MCP (core) to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: node scripts/publish-npm.js
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-desktop-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sideboard-ai/core build
      - name: Build & publish Electron (signed)
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm exec electron-vite build
          # electron-builder + electron-updater publish to GitHub Releases
          # Signing/notarization require the secrets above; unsigned builds still
          # upload artifacts for smoke testing but cannot auto-update on macOS.
          if [ -n "$CSC_LINK" ]; then
            pnpm exec electron-builder --mac --publish always
          else
            pnpm exec electron-builder --mac --publish always -c.mac.identity=null
          fi
