# Sideboard repo settings (preferred over .conductor/settings.toml).
# Schema mirrors Conductor's scripts/files-to-copy conventions so existing
# repos keep working via fallback.

[worktrees]
# Optional override. Default: ~/sideboard/workspaces/<repo-slug>
# root = "~/sideboard/workspaces/sideboard"

[scripts]
setup = "pnpm install"
run_mode = "concurrent"

[scripts.run.dev]
command = "PORT=${SIDEBOARD_PORT:-${CONDUCTOR_PORT:-5173}} pnpm --filter @sideboard-ai/desktop run dev"
default = true
icon = "play"
