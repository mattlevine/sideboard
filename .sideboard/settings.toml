# Sideboard repo settings (preferred over .conductor/settings.toml).
# Schema mirrors Conductor's scripts/files-to-copy conventions so existing
# repos keep working via fallback.
#
# Right-sidebar Stop does NOT run a settings teardown — it kills the process
# group for `scripts.run.*`. Optional `scripts.archive` only runs on Close/Archive.

[worktrees]
# Optional override. Default: ~/sideboard/workspaces/<repo-slug>
# root = "~/sideboard/workspaces/sideboard"

[scripts]
setup = "pnpm install"
run_mode = "concurrent"
# archive = "echo cleanup"  # optional; Close/Archive only — not Stop

[scripts.run.dev]
command = "PORT=${SIDEBOARD_PORT:-${CONDUCTOR_PORT:-5173}} pnpm --filter @sideboard-ai/desktop run dev"
default = true
icon = "play"

# Expo for apps/mobile. The Run log is not a TTY, so this opens the iOS Simulator.
[scripts.run.mobile]
command = "pnpm --filter @sideboard-ai/mobile exec expo start --ios --port ${SIDEBOARD_PORT:-${CONDUCTOR_PORT:-8081}}"
icon = "smartphone"
