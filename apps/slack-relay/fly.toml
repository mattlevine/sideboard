# fly.toml app configuration file generated for Sideboard Slack relay
#
# Deploy from the monorepo root (build context = repo root):
#   fly deploy --config apps/slack-relay/fly.toml --dockerfile apps/slack-relay/Dockerfile .
#
# First time:
#   fly apps create sideboard-slack-relay
#   fly secrets set SIDEBOARD_SLACK_APP_TOKEN=xapp-… -a sideboard-slack-relay
#   fly secrets set SIDEBOARD_SLACK_CLIENT_SECRET=… -a sideboard-slack-relay
#
# Custom domains:
#   fly certs add relay.sideboard.cloud -a sideboard-slack-relay
#   fly certs add www.sideboard.cloud -a sideboard-slack-relay
#   fly certs add sideboard.cloud -a sideboard-slack-relay
#   GoDaddy: AAAA sideboard.cloud → 2a09:8280:1::16a:3072:0
#   (www is a CNAME to the apex; A 66.241.125.177 is already set)
#
# HTTPS GET /slack/callback exchanges Slack OAuth (client secret stays on this app).
# Desktops poll GET /slack/oauth/result?state=…
# GET / on www.sideboard.cloud serves the static marketing site (repo site/).
# sideboard.cloud 301s to www.sideboard.cloud. relay.sideboard.cloud stays Slack.
# GET /health stays JSON for Fly checks.

app = 'sideboard-slack-relay'
primary_region = 'sjc'

[build]

[env]
  HOST = '0.0.0.0'
  SIDEBOARD_SITE_ROOT = '/app/site'
  SIDEBOARD_SITE_HOSTS = 'www.sideboard.cloud'
  SIDEBOARD_SITE_REDIRECT_HOSTS = 'sideboard.cloud'
  SIDEBOARD_SITE_CANONICAL = 'www.sideboard.cloud'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
