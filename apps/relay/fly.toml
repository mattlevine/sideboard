# fly.toml for the Sideboard relay (phone remote, marketing site, legacy Slack).
#
# Deploy from the monorepo root (build context = repo root):
#   fly deploy --config apps/relay/fly.toml --dockerfile apps/relay/Dockerfile .
#
# Fly cannot rename an application. The app id is sideboard-slack-relay.
# That id is historical: this process is the relay for the phone, the site,
# and legacy Slack, not a Slack-only service. Do not create a second app.
#
# First time (already done):
#   fly apps create sideboard-slack-relay
#   fly secrets set SIDEBOARD_SLACK_APP_TOKEN=xapp-… -a sideboard-slack-relay
#   fly secrets set SIDEBOARD_SLACK_CLIENT_SECRET=… -a sideboard-slack-relay
#
#   fly secrets set SIDEBOARD_RELAY_GITHUB_CLIENT_ID=… -a sideboard-slack-relay
#   fly secrets set SIDEBOARD_RELAY_GITHUB_CLIENT_SECRET=… -a sideboard-slack-relay
#   fly secrets set SIDEBOARD_RELAY_CURSOR_APP_ID=app_… -a sideboard-slack-relay
#   fly secrets set SIDEBOARD_RELAY_ENTIRE_CLIENT_ID=https://www.sideboard.cloud/oauth/entire-client.json -a sideboard-slack-relay
#   # confidential Entire clients only. The hosted metadata document is public (no secret).
#   fly secrets set SIDEBOARD_RELAY_ENTIRE_CLIENT_SECRET=… -a sideboard-slack-relay
#
# Phone accounts and pairings live in SQLite on a volume so restarts and image deploys keep them.
# One machine only: the volume and the live phone sockets are local to that process.
#   fly volumes create relay_accounts -a sideboard-slack-relay -r sjc -s 1
# GitHub OAuth App authorization callback URL:
#   https://relay.sideboard.build/remote/oauth/callback
#
# Custom domains (both names serve the site until the .cloud cutover):
#   fly certs add relay.sideboard.cloud -a sideboard-slack-relay
#   fly certs add www.sideboard.cloud -a sideboard-slack-relay
#   fly certs add sideboard.cloud -a sideboard-slack-relay
#   fly certs add sideboard.build -a sideboard-slack-relay
#   fly certs add www.sideboard.build -a sideboard-slack-relay
#   fly certs add relay.sideboard.build -a sideboard-slack-relay
#   GoDaddy A 66.241.125.177 and AAAA 2a09:8280:1::16a:3072:0 on each apex.
#   www is a CNAME to its apex. relay.sideboard.build is the same A/AAAA (or a CNAME
#   to 0peympp.sideboard-slack-relay.fly.dev). The public relay is relay.sideboard.build.
#   relay.sideboard.cloud still reaches this app.
#
# HTTPS GET /slack/callback exchanges Slack OAuth (client secret stays on this app).
# Desktops poll GET /slack/oauth/result?state=…
# GET / on the site hosts serves the static marketing site (repo site/).
# Hosts in SIDEBOARD_SITE_HOSTS are served even if they are also redirect hosts.
# relay.sideboard.build is the phone remote. GET /health stays JSON for Fly checks.

app = 'sideboard-slack-relay'
primary_region = 'sjc'

[build]

[env]
  HOST = '0.0.0.0'
  SIDEBOARD_SITE_ROOT = '/app/site'
  SIDEBOARD_SITE_HOSTS = 'www.sideboard.build,sideboard.build,www.sideboard.cloud,sideboard.cloud'
  SIDEBOARD_SITE_REDIRECT_HOSTS = 'sideboard.build,sideboard.cloud'
  SIDEBOARD_SITE_CANONICAL = 'www.sideboard.build'
  SIDEBOARD_RELAY_PUBLIC_ORIGIN = 'https://relay.sideboard.build'
  SIDEBOARD_RELAY_ACCOUNTS_PATH = '/data/relay-accounts.sqlite'

[[mounts]]
  source = 'relay_accounts'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Seconds. Fly max is 900. Desktop JSON-pings every 20s so NAT/proxy idle cannot leave a zombie Listen.
  [http_service.http_options]
    idle_timeout = 900

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
