# fly.toml for the Sideboard relay (phone remote, marketing site, legacy Slack).
#
# Deploy from the monorepo root (build context = repo root):
#   fly deploy --config apps/relay/fly.toml --dockerfile apps/relay/Dockerfile .
#
# The running Fly app is still sideboard-slack-relay until this one-time rename:
#   fly apps rename sideboard-relay -a sideboard-slack-relay
#
# First time (already done):
#   fly apps create sideboard-relay
#   fly secrets set SIDEBOARD_SLACK_APP_TOKEN=xapp-… -a sideboard-relay
#   fly secrets set SIDEBOARD_SLACK_CLIENT_SECRET=… -a sideboard-relay
#
#   fly secrets set SIDEBOARD_RELAY_GOOGLE_CLIENT_ID=… -a sideboard-relay
#   fly secrets set SIDEBOARD_RELAY_GOOGLE_CLIENT_SECRET=… -a sideboard-relay
#   fly secrets set SIDEBOARD_RELAY_GITHUB_CLIENT_ID=… -a sideboard-relay
#   fly secrets set SIDEBOARD_RELAY_GITHUB_CLIENT_SECRET=… -a sideboard-relay
#
# Phone accounts live in SQLite on a volume so restarts and image deploys keep them.
# One machine only: the volume and the live phone sockets are local to that process.
#   fly volumes create relay_accounts -a sideboard-relay -r sjc -s 1
# OAuth redirect URL for both providers:
#   https://relay.sideboard.cloud/remote/oauth/callback
#
# Custom domains:
#   fly certs add relay.sideboard.cloud -a sideboard-relay
#   fly certs add www.sideboard.cloud -a sideboard-relay
#   fly certs add sideboard.cloud -a sideboard-relay
#   GoDaddy: AAAA sideboard.cloud → 2a09:8280:1::16a:3072:0
#   (www is a CNAME to the apex; A 66.241.125.177 is already set)
#
# HTTPS GET /slack/callback exchanges Slack OAuth (client secret stays on this app).
# Desktops poll GET /slack/oauth/result?state=…
# GET / on www.sideboard.cloud serves the static marketing site (repo site/).
# sideboard.cloud 301s to www.sideboard.cloud. relay.sideboard.cloud is the phone remote.
# GET /health stays JSON for Fly checks.

app = 'sideboard-relay'
primary_region = 'sjc'

[build]

[env]
  HOST = '0.0.0.0'
  SIDEBOARD_SITE_ROOT = '/app/site'
  SIDEBOARD_SITE_HOSTS = 'www.sideboard.cloud'
  SIDEBOARD_SITE_REDIRECT_HOSTS = 'sideboard.cloud'
  SIDEBOARD_SITE_CANONICAL = 'www.sideboard.cloud'
  SIDEBOARD_RELAY_PUBLIC_ORIGIN = 'https://relay.sideboard.cloud'
  SIDEBOARD_RELAY_ACCOUNTS_PATH = '/data/relay-accounts.sqlite'

[[mounts]]
  source = 'relay_accounts'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Seconds. Fly max is 900. Desktop JSON-pings every 20s so NAT/proxy idle cannot leave a zombie Listen.
  [http_service.http_options]
    idle_timeout = 900

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
